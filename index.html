<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NovaChat</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #050505; color: white; margin: 0; padding: 0; position: fixed; top: 0; left: 0; right: 0; bottom: 0; }
        .center-screen { display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; position: absolute; z-index: 1000; background: #050505; }
        .login-card { background: rgba(20, 20, 20, 0.95); border: 1px solid rgba(255, 215, 0, 0.2); box-shadow: 0 0 30px rgba(255, 215, 0, 0.1); padding: 40px; border-radius: 20px; width: 90%; max-width: 400px; text-align: center; }
        .login-card input { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255,255,255,0.1); color: white; padding: 15px 25px; border-radius: 50px; width: 100%; outline: none; margin-bottom: 15px; }
        .login-card input:focus { border-color: #FFD700; box-shadow: 0 0 10px rgba(255, 215, 0, 0.2); }
        .btn-gold { background: linear-gradient(135deg, #FFD700, #FFA500); border: none; color: #000; padding: 12px; border-radius: 50px; font-weight: 900; width: 100%; margin-bottom: 10px; display: flex; justify-content: center; align-items: center; gap: 10px; }
        .btn-outline-gold { background: transparent; border: 1px solid #FFD700; color: #FFD700; padding: 12px; border-radius: 50px; font-weight: 600; width: 100%; }
        
        #app-screen { display: none; position: absolute; top: 0; bottom: 0; left: 0; right: 0; background: transparent; overflow: hidden; display: flex; flex-direction: row; }
        .sidebar { width: 300px; background: #0a0a0a; border-right: 1px solid rgba(255,215,0,0.1); display: flex; flex-direction: column; flex-shrink: 0; }
        .sidebar-header { padding: 25px; border-bottom: 1px solid rgba(255, 215, 0, 0.1); white-space: nowrap; overflow: hidden; }
        .list-group-item { background: transparent; color: rgba(255,255,255,0.6); border: none; padding: 15px 20px; cursor: pointer; display: flex; align-items: center; position: relative; transition: 0.2s; }
        .list-group-item:hover, .active-chat { background: rgba(255, 215, 0, 0.1); color: #FFD700; }
        
        .chat-area { flex: 1; min-width: 0; display: flex; flex-direction: column; height: 100%; }
        .chat-header { background: #0a0a0a; border-bottom: 1px solid rgba(255, 215, 0, 0.2); padding: 0 15px; height: 60px; display: flex; align-items: center; justify-content: space-between; position: relative; z-index: 10; }
        
        #messages { flex: 1; list-style: none; padding: 15px; overflow-y: auto; overflow-x: hidden; display: flex; flex-direction: column; gap: 15px; margin: 0; }
        .msg-bubble { padding: 10px 15px; border-radius: 20px; font-size: 0.95rem; word-wrap: break-word; max-width: 75%; position: relative; }
        .msg-sent { align-self: flex-end; background: linear-gradient(135deg, #FFD700, #FFA500); color: black; font-weight: 500; border-bottom-right-radius: 2px; }
        .msg-received { align-self: flex-start; background: #222; color: white; border-bottom-left-radius: 2px; border: 1px solid rgba(255,255,255,0.1); }
        .msg-name { font-size: 0.75rem; font-weight: bold; margin-bottom: 5px; opacity: 0.8; }
        .msg-image { max-width: 100%; border-radius: 10px; margin-top: 5px; }
        .msg-audio { margin-top: 5px; filter: invert(1); height: 35px; width: 100%; min-width: 160px; }

        .typing-indicator { font-size: 0.8rem; color: #FFD700; font-style: italic; padding: 0 15px; height: 20px; }

        .input-area { background: #0a0a0a; padding: 10px; display: flex; gap: 8px; align-items: center; border-top: 1px solid rgba(255,255,255,0.1); flex-shrink: 0; padding-bottom: 15px; }
        .input-area input[type="text"] { background: #1a1a1a; border: 1px solid rgba(255,255,255,0.1); color: white; padding: 10px 20px; border-radius: 50px; flex: 1; outline: none; }
        .action-btn { background: #1a1a1a; color: #FFD700; border: 1px solid rgba(255,215,0,0.3); width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s; flex-shrink: 0; }
        .action-btn:hover, .recording { background: #FFD700; color: #000; }
        .btn-send { background: linear-gradient(135deg, #FFD700, #FFA500); color: #000; border: none; width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        
        .avatar { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; margin-right: 15px; background: rgba(255, 215, 0, 0.1); color: #FFD700; border: 1px solid rgba(255, 215, 0, 0.2); flex-shrink: 0; }
        .notification-badge { background-color: #FFD700; color: black; border-radius: 50%; padding: 2px 6px; font-size: 0.7rem; font-weight: bold; position: absolute; right: 10px; top: 35%; }

        .custom-modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 2000; align-items: center; justify-content: center; }
        .custom-modal-card { background: #111; padding: 30px; border-radius: 20px; border: 2px solid #FFD700; text-align: center; width: 350px; box-shadow: 0 0 50px rgba(255, 215, 0, 0.2); }
        .big-code { font-size: 32px; color: #FFD700; letter-spacing: 5px; font-weight: 800; margin: 20px 0; user-select: all; }
        .space-code-display { border: 1px solid #FFD700; background: rgba(255, 215, 0, 0.1); color: #FFD700; padding: 5px 15px; border-radius: 20px; font-weight: bold; letter-spacing: 2px; font-size: 0.9rem; margin-right: 10px; }
        .big-code-input { width: 100%; background: rgba(255, 215, 0, 0.05); border: 1px solid rgba(255, 215, 0, 0.5); border-radius: 15px; text-align: center; outline: none; color: #FFD700; font-size: 20px; font-weight: 800; padding: 15px; margin-bottom: 20px; }

        /* --- MOBILE FIXES --- */
        @media (max-width: 768px) {
            .sidebar { width: 60px; } 
            .sidebar-header h4, .sidebar-header small { display: none; } 
            .list-group-item div:nth-child(2) { display: none; }
            
            .chat-header { padding: 0 8px; }
            #chat-title { font-size: 1rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 80px; }
            #chat-status { font-size: 0.7rem; }
            .space-code-display { padding: 4px 6px; font-size: 0.65rem; margin-right: 2px; letter-spacing: 0.5px; }
            .chat-header .btn-sm { padding: 4px 6px; font-size: 0.75rem; }

            .input-area { padding: 10px 5px; gap: 5px; }
            .input-area input[type="text"] { padding: 10px 12px; font-size: 0.9rem; min-width: 0; }
            .action-btn, .btn-send { width: 36px; height: 36px; }

            .msg-bubble { max-width: 85%; }
            .msg-audio { min-width: 140px; max-width: 100%; }
        }
    </style>
</head>
<body>

    <div id="login-screen" class="center-screen">
        <div class="login-card">
            <h2 class="fw-bold mb-4" style="color: #FFD700;"><i class="fas fa-meteor me-2"></i>NovaChat</h2>
            <input type="text" id="nickname" placeholder="Enter Your Nickname" autocomplete="off" onclick="handleDevClick()">
            <div id="join-inputs" style="display: none;">
                <input type="text" id="space-code-input" placeholder="Space Code" style="text-transform: uppercase;">
            </div>
            <button id="btn-create" onclick="createSpace()" class="btn btn-gold w-100 mb-2">Create New Space <i class="fas fa-rocket"></i></button>
            <button id="btn-join-mode" onclick="showJoinMode()" class="btn btn-outline-gold w-100">Join Existing Space</button>
            <button id="btn-join-submit" onclick="joinSpace()" class="btn btn-gold w-100" style="display: none;">Enter Space</button>
            <button id="btn-back" onclick="resetLogin()" class="btn btn-link text-muted" style="display: none;">Back</button>
        </div>
    </div>

    <div id="dev-login-screen" class="center-screen" style="display: none;">
        <div class="login-card" style="border-color: #ff4d4d;">
            <h2 class="fw-bold mb-4" style="color: #ff4d4d;"><i class="fas fa-user-secret me-2"></i>Dev Portal</h2>
            <input type="password" id="dev-password" placeholder="Enter Master Key" onkeypress="if(event.key === 'Enter') attemptDevLogin()">
            <button onclick="attemptDevLogin()" class="btn btn-danger w-100 fw-bold">Authenticate</button>
            <button onclick="window.location.reload()" class="btn btn-link text-muted mt-2">Cancel</button>
        </div>
    </div>

    <div id="admin-dashboard">
        <div class="d-flex justify-content-between align-items-center mb-4 border-bottom border-secondary pb-3">
            <h2 style="color: #FFD700; font-weight: 900;"><i class="fas fa-shield-alt"></i> Sentinel</h2>
            <div>
                <button class="btn btn-outline-warning me-2" onclick="refreshAdminData()"><i class="fas fa-sync-alt"></i> Refresh</button>
                <button class="btn btn-outline-light" onclick="window.location.reload()">Exit</button>
            </div>
        </div>
        <div class="row">
            <div class="col-6"><div class="admin-stat-card"><p class="small text-muted">Users</p><h3 id="stat-users">0</h3></div></div>
            <div class="col-6"><div class="admin-stat-card"><p class="small text-muted">Spaces</p><h3 id="stat-spaces">0</h3></div></div>
        </div>
        <table class="admin-table mt-4">
            <thead><tr><th>Code</th><th>Name</th><th>IP</th><th>Keyword</th></tr></thead>
            <tbody id="admin-logs-list"></tbody>
        </table>
    </div>

    <div id="code-modal" class="custom-modal-overlay">
        <div class="custom-modal-card">
            <h4 style="color: white; margin-bottom: 20px;">Configure Space</h4>
            <input type="text" id="modal-space-name" class="big-code-input" placeholder="e.g. Study Group">
            <div class="big-code" id="generated-code">...</div>
            <button class="btn btn-gold w-100 mb-2" onclick="copyCode()">Copy Code</button>
            <button class="btn btn-outline-gold w-100" onclick="enterApp()">OK, Enter Chat</button>
        </div>
    </div>

    <div id="edit-modal" class="custom-modal-overlay">
        <div class="custom-modal-card">
            <h4>Edit Message</h4>
            <input type="hidden" id="edit-message-id">
            <input type="text" id="edit-message-input" class="big-code-input text-white">
            <button class="btn btn-gold w-100 mb-2" onclick="submitEdit()">Save</button>
            <button class="btn btn-outline-light w-100" onclick="document.getElementById('edit-modal').style.display='none'">Cancel</button>
        </div>
    </div>

    <div id="end-modal" class="custom-modal-overlay">
        <div class="custom-modal-card">
            <h4 class="text-danger">End Session?</h4>
            <button class="btn btn-danger w-100 mb-2" onclick="confirmEndSpace()">Yes, End It</button>
            <button class="btn btn-outline-light w-100" onclick="closeEndModal()">Cancel</button>
        </div>
    </div>

    <div id="app-screen">
        <div class="sidebar">
            <div class="sidebar-header"><h4 style="color: #FFD700;"><i class="fas fa-meteor"></i></h4><small id="my-name-display"></small></div>
            <ul id="user-list" class="list-group list-group-flush"></ul>
        </div>
        <div class="chat-area">
            <div class="chat-header">
                <div><h5 id="chat-title" class="m-0">...</h5><small id="chat-status">Space Chat</small></div>
                <div class="d-flex align-items-center gap-2">
                    <div id="header-code-display" class="space-code-display">...</div>
                    <button class="btn btn-sm btn-outline-warning rounded-pill" onclick="clearLocalHistory()"><i class="fas fa-trash"></i></button>
                    <button class="btn btn-sm btn-outline-danger rounded-pill" onclick="showEndModal()"><i class="fas fa-power-off"></i></button>
                </div>
            </div>
            <ul id="messages"></ul>
            <div id="typing-status" class="typing-indicator"></div>
            <div class="input-area">
                <label for="file-upload" class="action-btn m-0"><i class="fas fa-paperclip"></i></label>
                <input type="file" id="file-upload" style="display:none;" onchange="handleFileUpload(event)">
                <input type="text" id="message-input" placeholder="Message..." onkeypress="handleEnter(event)" oninput="handleTyping()">
                <button id="mic-btn" class="action-btn m-0" onmousedown="startRecording()" onmouseup="stopRecording()" ontouchstart="startRecording()" ontouchend="stopRecording()"><i class="fas fa-microphone"></i></button>
                <button class="btn-send" onclick="sendMessage()"><i class="fas fa-paper-plane"></i></button>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let myName = "", currentRecipient = "Everyone", mySpaceCode = "", unreadCounts = {}, isHost = false, spaceNameDisplay = "Public Space", chatStore = { 'Everyone': [] };

        let clickCount = 0, clickTimer, currentAdminPassword = "";
        function handleDevClick() {
            clickCount++; clearTimeout(clickTimer);
            clickTimer = setTimeout(() => { clickCount = 0; }, 2000); 
            if (clickCount >= 15) {
                clickCount = 0;
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('dev-login-screen').style.display = 'flex';
            }
        }
        function attemptDevLogin() { currentAdminPassword = document.getElementById('dev-password').value; socket.emit('admin_login', currentAdminPassword); }
        function refreshAdminData() { if (currentAdminPassword) socket.emit('admin_login', currentAdminPassword); }
        
        socket.on('admin_login_success', (data) => {
            document.getElementById('dev-login-screen').style.display = 'none'; document.getElementById('admin-dashboard').style.display = 'block';
            document.getElementById('stat-users').innerText = data.totalUsers;
            document.getElementById('stat-spaces').innerText = data.activeSpaces.length;
            document.getElementById('admin-logs-list').innerHTML = data.logs.map(log => `<tr><td>${log.id}</td><td>${log.space_name}</td><td>${log.ip_address}</td><td style="color:red">${log.flagged_word}</td></tr>`).join('');
        });
        socket.on('admin_error', (msg) => alert(msg));

        function showJoinMode() { document.getElementById("btn-create").style.display = "none"; document.getElementById("btn-join-mode").style.display = "none"; document.getElementById("join-inputs").style.display = "block"; document.getElementById("btn-join-submit").style.display = "block"; document.getElementById("btn-back").style.display = "block"; }
        function resetLogin() { document.getElementById("btn-create").style.display = "flex"; document.getElementById("btn-join-mode").style.display = "block"; document.getElementById("join-inputs").style.display = "none"; document.getElementById("btn-join-submit").style.display = "none"; document.getElementById("btn-back").style.display = "none"; }
        function createSpace() { const name = document.getElementById("nickname").value.trim(); if(!name) return; myName = name; socket.emit("create_space", { name: name, spaceName: "Public Space" }); }
        function joinSpace() { const name = document.getElementById("nickname").value.trim(); const code = document.getElementById("space-code-input").value.trim().toUpperCase(); if(!name || !code) return; myName = name; socket.emit("join_space", { name: name, code: code }); }

        socket.on("space_created", (data) => { mySpaceCode = data.code; isHost = data.isHost; spaceNameDisplay = data.spaceName; document.getElementById("generated-code").innerText = data.code; document.getElementById("modal-space-name").value = ""; document.getElementById("login-screen").style.display = "none"; document.getElementById("code-modal").style.display = "flex"; });
        socket.on("joined_success", (data) => { mySpaceCode = data.code; isHost = data.isHost; spaceNameDisplay = data.spaceName; enterApp(); });

        function enterApp() {
            if (isHost) { const inputName = document.getElementById("modal-space-name").value.trim(); if (inputName) { spaceNameDisplay = inputName; socket.emit("update_space_name", inputName); } }
            document.getElementById("code-modal").style.display = "none"; document.getElementById("app-screen").style.display = "flex"; document.getElementById("my-name-display").innerText = myName; document.getElementById("header-code-display").innerText = "CODE: " + mySpaceCode; switchChat("Everyone");
        }

        function copyCode() { navigator.clipboard.writeText(document.getElementById("generated-code").innerText); alert("Copied!"); }
        function showEndModal() { document.getElementById("end-modal").style.display = "flex"; }
        function closeEndModal() { document.getElementById("end-modal").style.display = "none"; }
        function confirmEndSpace() { socket.emit("end_space"); location.reload(); }
        function clearLocalHistory() { chatStore[currentRecipient] = []; document.getElementById("messages").innerHTML = ""; }

        function switchChat(user) { currentRecipient = user; unreadCounts[user] = 0; updateUserListUI(); document.getElementById("chat-title").innerText = user === "Everyone" ? spaceNameDisplay : user; document.getElementById("messages").innerHTML = ""; (chatStore[user] || []).forEach(msg => appendMsg(msg)); }

        let typingTimeout;
        function handleTyping() { socket.emit('typing'); clearTimeout(typingTimeout); typingTimeout = setTimeout(() => socket.emit('stop_typing'), 1500); }
        let currentlyTyping = new Set();
        socket.on('user_typing', (name) => { currentlyTyping.add(name); updateTypingUI(); });
        socket.on('user_stopped_typing', (name) => { currentlyTyping.delete(name); updateTypingUI(); });
        function updateTypingUI() { document.getElementById('typing-status').innerText = currentlyTyping.size ? `${[...currentlyTyping][0]} is typing...` : ""; }

        function handleFileUpload(e) {
            const file = e.target.files[0]; if(!file) return;
            const reader = new FileReader(); reader.readAsDataURL(file);
            reader.onload = (evt) => { socket.emit("send_media", { fileData: evt.target.result, fileName: file.name, fileType: file.type.startsWith('image/') ? 'image' : 'file', toUser: currentRecipient }); };
        }

        let mediaRecorder, audioChunks = [];
        function startRecording() {
            navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
                document.getElementById('mic-btn').classList.add('recording');
                mediaRecorder = new MediaRecorder(stream); mediaRecorder.start();
                mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                mediaRecorder.onstop = () => {
                    document.getElementById('mic-btn').classList.remove('recording');
                    const reader = new FileReader(); reader.readAsDataURL(new Blob(audioChunks, { type: 'audio/webm' }));
                    reader.onloadend = () => { socket.emit("send_media", { fileData: reader.result, fileName: "Voice.webm", fileType: 'audio', toUser: currentRecipient }); };
                    audioChunks = []; stream.getTracks().forEach(t => t.stop());
                };
            });
        }
        function stopRecording() { if(mediaRecorder) mediaRecorder.stop(); }

        function openEdit(id, text) { document.getElementById('edit-message-id').value = id; document.getElementById('edit-message-input').value = text; document.getElementById('edit-modal').style.display = 'flex'; }
        function submitEdit() { socket.emit('edit_message', { messageId: document.getElementById('edit-message-id').value, newMsg: document.getElementById('edit-message-input').value }); document.getElementById('edit-modal').style.display = 'none'; }
        socket.on('message_edited', (d) => { const el = document.getElementById(`text-${d.messageId}`); if(el) el.innerText = d.newMsg + " (edited)"; });

        function sendMessage() { const i = document.getElementById("message-input"); if (i.value.trim()) { socket.emit("send_message", { msg: i.value, toUser: currentRecipient }); i.value = ""; } }
        function handleEnter(e) { if(e.key === "Enter") sendMessage(); }

        socket.on("receive_message", (d) => {
            const k = d.isPrivate ? (d.sender === myName ? d.toUser : d.sender) : 'Everyone';
            if (!chatStore[k]) chatStore[k] = []; chatStore[k].push(d);
            if ((currentRecipient === "Everyone" && !d.isPrivate) || (d.isPrivate && (d.sender === currentRecipient || (d.sender === myName && d.toUser === currentRecipient)))) appendMsg(d);
            else if (d.sender !== myName) { unreadCounts[d.sender] = (unreadCounts[d.sender] || 0) + 1; updateUserListUI(); }
        });

        function appendMsg(d) {
            const list = document.getElementById("messages");
            const li = document.createElement("li"); li.id = d.messageId; li.style.display = "flex"; li.style.flexDirection = "column"; li.style.marginBottom = "10px";
            let c = "";
            if (d.type === 'text') c = `<span id="text-${d.messageId}">${d.msg}</span>`;
            else if (d.type === 'image') c = `<img src="${d.msg}" class="msg-image">`;
            else if (d.type === 'audio') c = `<audio controls src="${d.msg}" class="msg-audio"></audio>`;
            else c = `<a href="${d.msg}" download="${d.fileName}">${d.fileName}</a>`;

            let editBtn = (d.sender === myName && d.type === 'text') ? `<i class="fas fa-edit text-primary ms-2 action-icon" style="cursor:pointer; display:none;" onclick="openEdit('${d.messageId}', document.getElementById('text-${d.messageId}').innerText)"></i>` : '';
            let delBtn = (d.sender === myName || isHost) ? `<i class="fas fa-trash text-danger ms-2 action-icon" style="cursor:pointer; display:none;" onclick="deleteMessage('${d.messageId}')"></i>` : '';

            if (d.sender !== myName) {
                li.style.alignItems = "flex-start";
                li.innerHTML = `<div class="msg-name">${d.sender}</div><div class="msg-bubble msg-received" onmouseenter="showA(this)" onmouseleave="hideA(this)">${c}${delBtn}</div>`;
            } else {
                li.style.alignItems = "flex-end";
                li.innerHTML = `<div class="msg-bubble msg-sent" onmouseenter="showA(this)" onmouseleave="hideA(this)">${c}${editBtn}${delBtn}</div>`;
            }
            list.appendChild(li); list.scrollTop = list.scrollHeight;
        }

        function showA(el) { el.querySelectorAll('.action-icon').forEach(b => b.style.display = 'inline-block'); }
        function hideA(el) { el.querySelectorAll('.action-icon').forEach(b => b.style.display = 'none'); }

        socket.on("update_user_list", (users) => {
            const list = document.getElementById("user-list");
            list.innerHTML = `<li class="list-group-item ${currentRecipient === 'Everyone' ? 'active-chat' : ''}" onclick="switchChat('Everyone')"><div class="avatar"><i class="fas fa-users"></i></div><div><b>${spaceNameDisplay}</b></div></li>`;
            users.forEach(u => {
                if(u.name !== myName) list.innerHTML += `<li class="list-group-item ${u.name === currentRecipient ? 'active-chat' : ''}" onclick="switchChat('${u.name}')"><div class="avatar">${u.name[0]}</div><div><b>${u.name}</b> ${unreadCounts[u.name] ? `<span class="badge bg-warning">${unreadCounts[u.name]}</span>` : ""}</div></li>`;
            });
        });

        function deleteMessage(id) { socket.emit("delete_message", { messageId: id }); }
        socket.on("message_removed", (id) => { const el = document.getElementById(id); if (el) el.innerHTML = "<i>Deleted</i>"; });
        socket.on("kicked", () => location.reload());
        socket.on("space_ended", () => location.reload());
    </script>
</body>
</html>
