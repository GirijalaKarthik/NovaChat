<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NovaChat - Campus Connect</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #121212; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        #app { width: 400px; background: #1e1e1e; padding: 20px; border-radius: 10px; box-shadow: 0 0 15px rgba(255, 215, 0, 0.2); }
        h2 { text-align: center; color: #ffd700; }
        input, button { width: 100%; padding: 10px; margin: 5px 0; border-radius: 5px; border: none; }
        input { background: #333; color: white; }
        button { background: #ffd700; color: black; font-weight: bold; cursor: pointer; }
        button:hover { background: #e6c200; }
        #chat-screen { display: none; flex-direction: column; height: 500px; }
        #chat-box { flex: 1; overflow-y: auto; padding: 10px; background: #252525; border-radius: 5px; margin-bottom: 10px; }
        .message { padding: 5px 10px; margin: 5px 0; border-radius: 5px; max-width: 80%; }
        .sent { background: #ffd700; color: black; align-self: flex-end; margin-left: auto; }
        .received { background: #333; color: white; align-self: flex-start; }
        
        /* ADMIN PANEL STYLES */
        #admin-panel { display: none; background-color: #222; padding: 15px; margin-bottom: 10px; border-radius: 8px; border-left: 5px solid #ffd700; color: white; }
        .admin-btn { background: #ffd700; color: #000; border: none; padding: 8px 15px; font-weight: bold; cursor: pointer; border-radius: 4px; margin-top: 5px;}
    </style>
</head>
<body>

<div id="app">
    <div id="login-screen">
        <h2>🔥 NovaChat Login</h2>
        <input type="text" id="username" placeholder="Username (e.g. Hod@mca)">
        <input type="password" id="password" placeholder="Password">
        <button onclick="login()">Login</button>
        <button onclick="register()" style="background: #333; color: #ccc;">Create Account</button>
    </div>

    <div id="chat-screen">
        
        <div id="admin-panel">
            <h3 style="color: #ffd700; margin: 0;">👑 Admin Dashboard</h3>
            <p style="font-size: 12px; margin: 5px 0;">You have authorized access.</p>
            <button class="admin-btn" onclick="createGroup()">+ Create New Group</button>
        </div>

        <div id="chat-box"></div>
        <div style="display: flex; gap: 5px;">
            <input type="text" id="message" placeholder="Type a message...">
            <button onclick="sendMessage()" style="width: 20%;">➤</button>
        </div>
        <p style="font-size: 10px; color: #555; text-align: center;">Users Online: <span id="user-count">0</span></p>
    </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
    const socket = io();
    let username = "";

    // --- LOGIN ---
    function login() {
        username = document.getElementById("username").value;
        const pass = document.getElementById("password").value;
        if (username && pass) socket.emit("login_request", { username, password: pass });
    }

    function register() {
        const user = document.getElementById("username").value;
        const pass = document.getElementById("password").value;
        if (user && pass) socket.emit("register_request", { username: user, password: pass });
    }

    socket.on("login_response", (data) => {
        if (data.success) {
            document.getElementById("login-screen").style.display = "none";
            document.getElementById("chat-screen").style.display = "flex";
            
            // 👑 CHECK ROLE & SHOW ADMIN PANEL
            if (data.role === 'admin') {
                document.getElementById("admin-panel").style.display = "block";
            } else {
                document.getElementById("admin-panel").style.display = "none";
            }
        } else {
            alert(data.msg);
        }
    });

    socket.on("register_response", (data) => alert(data.msg));

    // --- CHAT ---
    function sendMessage() {
        const msg = document.getElementById("message").value;
        if (msg) {
            socket.emit("send_message", { sender: username, msg });
            document.getElementById("message").value = "";
        }
    }

    socket.on("receive_message", (data) => {
        const chatBox = document.getElementById("chat-box");
        const msgDiv = document.createElement("div");
        msgDiv.classList.add("message");
        
        if (data.sender === username) msgDiv.classList.add("sent");
        else msgDiv.classList.add("received");

        // 👑 Gold Border for Admins
        let displayName = data.sender;
        if (data.isAdmin) {
            displayName = "👑 " + data.sender;
            msgDiv.style.border = "1px solid #ffd700";
        }

        msgDiv.innerHTML = `<strong>${displayName}:</strong> ${data.msg}`;
        chatBox.appendChild(msgDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
    });

    socket.on("load_messages", (chats) => {
        document.getElementById("chat-box").innerHTML = "";
        chats.forEach(chat => {
            const msgDiv = document.createElement("div");
            msgDiv.classList.add("message");
            msgDiv.classList.add(chat.sender_name === username ? "sent" : "received");
            msgDiv.innerHTML = `<strong>${chat.sender_name}:</strong> ${chat.message}`;
            document.getElementById("chat-box").appendChild(msgDiv);
        });
    });

    socket.on("update_user_list", (users) => {
        document.getElementById("user-count").innerText = users.length;
    });

    // --- 👑 ADMIN FUNCTIONS ---
    function createGroup() {
        const groupName = prompt("Enter the name of the new Group (e.g., 'MCA Notices'):");
        if (!groupName) return; 

        const description = prompt("Enter a short description:");
        
        // Send to server
        socket.emit("create_group_request", { name: groupName, desc: description });
    }

    // Listen for success/failure
    socket.on("group_creation_response", (data) => {
        alert(data.msg); // Pop up message
        if (data.success) {
            // Later we will add code here to refresh the group list!
        }
    });

</script>
</body>
</html>
