<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nebula Network</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        /* --- 1. NEBULA UNIVERSE BACKGROUND --- */
        body { 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: radial-gradient(circle at center, #1a0b2e 0%, #000000 100%); /* Deep Space Purple/Black */
            color: white; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
            overflow: hidden;
        }

        /* --- 2. LOGIN SCREEN (Your Gold Meteor Design) --- */
        #login-screen { 
            width: 380px; 
            background: rgba(15, 15, 15, 0.95); /* Solid dark for login */
            padding: 40px; 
            border-radius: 20px; 
            border: 1px solid #333;
            box-shadow: 0 0 50px rgba(255, 215, 0, 0.1); 
            text-align: center;
            z-index: 100;
        }

        h2 { 
            color: #ffd700; 
            margin-bottom: 30px; 
            font-size: 32px; 
            font-weight: 800; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 15px;
            letter-spacing: 1px;
        }
        
        .logo-icon { font-size: 32px; color: #ffd700; transform: rotate(-10deg); }

        .role-selector { display: flex; justify-content: center; gap: 20px; margin-bottom: 25px; color: #eee; font-weight: 500; }
        .role-selector label { cursor: pointer; display: flex; align-items: center; gap: 8px; }
        input[type="radio"] { accent-color: #ffd700; transform: scale(1.3); cursor: pointer; }

        .login-input { 
            width: 100%; padding: 15px 20px; margin: 10px 0; border-radius: 30px; 
            border: none; background: #222; color: white; font-size: 16px; 
            box-sizing: border-box; outline: none; transition: 0.3s;
        }
        .login-input:focus { background: #2a2a2a; box-shadow: 0 0 15px rgba(255, 215, 0, 0.2); }

        .btn-primary { 
            width: 100%; padding: 16px; margin-top: 25px; border-radius: 30px; border: none; 
            font-size: 18px; font-weight: 900; cursor: pointer; background: #ffd700; color: black; 
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.3); text-transform: uppercase; letter-spacing: 1px;
            display: flex; justify-content: center; align-items: center; gap: 10px;
        }
        .btn-primary:hover { transform: scale(1.02); box-shadow: 0 0 40px rgba(255, 215, 0, 0.6); }

        .btn-secondary {
            width: 100%; padding: 15px; margin-top: 15px; border-radius: 30px; background: transparent; 
            border: 1px solid #444; color: #bbb; font-size: 14px; cursor: pointer;
        }
        .btn-secondary:hover { border-color: white; color: white; }


        /* --- 3. THE NEBULA CHAT INTERFACE (RESTORED) --- */
        #chat-screen { 
            display: none; 
            flex-direction: column; 
            /* THE BIG WIDE INTERFACE */
            width: 90vw; 
            height: 90vh; 
            max-width: 1200px;
            background: rgba(20, 20, 25, 0.7); /* Glass Effect */
            backdrop-filter: blur(15px);
            border-radius: 25px; 
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 50px rgba(0,0,0,0.8); 
            overflow: hidden; 
            position: relative;
        }

        /* Header */
        .chat-header {
            background: rgba(0, 0, 0, 0.3);
            padding: 20px 30px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .chat-title { 
            color: #fff; 
            font-weight: 700; 
            font-size: 24px; 
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
        }
        .online-badge { 
            background: rgba(0, 255, 0, 0.1); 
            color: #00ff88; 
            padding: 5px 15px; 
            border-radius: 20px; 
            font-size: 14px; 
            border: 1px solid rgba(0, 255, 136, 0.2);
        }

        /* The Chat Area */
        #chat-box { 
            flex: 1; 
            overflow-y: auto; 
            padding: 30px; 
            display: flex; 
            flex-direction: column; 
            gap: 15px;
        }

        /* Scrollbar Styling */
        #chat-box::-webkit-scrollbar { width: 8px; }
        #chat-box::-webkit-scrollbar-thumb { background: #444; border-radius: 4px; }
        
        /* Message Bubbles - Nebula Style */
        .message { 
            padding: 12px 20px; 
            border-radius: 18px; 
            max-width: 60%; 
            font-size: 16px; 
            line-height: 1.5; 
            position: relative;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* My Messages (Purple/Blue Gradient) */
        .sent { 
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            color: white; 
            align-self: flex-end; 
            border-bottom-right-radius: 4px;
            box-shadow: 0 5px 15px rgba(37, 117, 252, 0.3);
        }
        
        /* Others (Dark Glass) */
        .received { 
            background: rgba(255, 255, 255, 0.1); 
            color: #eee; 
            align-self: flex-start; 
            border-bottom-left-radius: 4px;
        }

        /* Admin Messages (Gold Glow) */
        .admin-msg { 
            border: 1px solid #ffd700; 
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.2);
        }

        /* Admin Panel (Integrated Glass) */
        #admin-panel { 
            background: rgba(255, 215, 0, 0.1); 
            padding: 15px 30px; 
            border-bottom: 1px solid rgba(255, 215, 0, 0.2);
            display: none; 
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Input Area */
        .chat-input-area { 
            padding: 20px 30px; 
            background: rgba(0, 0, 0, 0.3); 
            display: flex; 
            gap: 15px; 
            align-items: center;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        .chat-input { 
            flex: 1; 
            padding: 18px 25px; 
            border-radius: 50px; 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            background: rgba(255, 255, 255, 0.05); 
            color: white; 
            font-size: 16px; 
            outline: none;
            transition: 0.3s;
        }
        .chat-input:focus { background: rgba(255, 255, 255, 0.1); border-color: #ffd700; }

        .send-btn { 
            background: linear-gradient(135deg, #ffd700, #ffaa00); 
            color: black; 
            border: none; 
            width: 55px; 
            height: 55px; 
            border-radius: 50%; 
            font-size: 20px; 
            cursor: pointer; 
            display: flex; 
            justify-content: center; 
            align-items: center;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.4);
            transition: 0.2s;
        }
        .send-btn:hover { transform: scale(1.1); }

    </style>
</head>
<body>

<div id="login-screen">
    <h2><i class="fa-solid fa-meteor logo-icon"></i> NovaChat</h2>
    
    <div class="role-selector">
        <label><input type="radio" name="role" value="student" checked onchange="togglePlaceholder()"> Student</label>
        <label><input type="radio" name="role" value="admin" onchange="togglePlaceholder()"> Admin</label>
    </div>

    <input type="text" id="username" class="login-input" placeholder="Username">
    <input type="password" id="password" class="login-input" placeholder="Password">
    
    <button id="login-btn" class="btn-primary" onclick="login()">
        LAUNCH <i class="fa-solid fa-rocket"></i>
    </button>
    <button class="btn-secondary" onclick="register()">Create Account</button>
</div>

<div id="chat-screen">
    <div class="chat-header">
        <div class="chat-title">
            <i class="fa-brands fa-space-awesome" style="color:#a855f7; margin-right:10px;"></i> 
            NEBULA NETWORK
        </div>
        <div class="online-badge"><span id="user-count">0</span> Online</div>
    </div>

    <div id="admin-panel" style="display:none;">
        <span style="color:#ffd700; font-weight:bold; letter-spacing:1px;">👑 COMMAND CENTER</span>
        <button onclick="createGroup()" style="background:rgba(255, 215, 0, 0.2); border:1px solid #ffd700; color:#ffd700; padding:8px 20px; border-radius:30px; font-weight:bold; cursor:pointer;">+ POST NOTICE</button>
    </div>

    <div id="chat-box"></div>

    <div class="chat-input-area">
        <input type="text" id="message" class="chat-input" placeholder="Transmit a message...">
        <button class="send-btn" onclick="sendMessage()"><i class="fa-solid fa-paper-plane"></i></button>
    </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
    const socket = io();
    let username = "";

    function togglePlaceholder() {
        const role = document.querySelector('input[name="role"]:checked').value;
        const input = document.getElementById("username");
        if(role === 'admin') input.placeholder = "Admin ID (e.g. Hod@mca)";
        else input.placeholder = "Student Name";
    }

    function login() {
        username = document.getElementById("username").value;
        const pass = document.getElementById("password").value;
        const btn = document.getElementById("login-btn");

        if (username && pass) {
            btn.innerHTML = 'IGNITION... <i class="fa-solid fa-spinner fa-spin"></i>'; 
            btn.style.opacity = "0.7";
            socket.emit("login_request", { username, password: pass });
        } else {
            alert("Please enter both Username and Password!");
        }
    }

    function register() {
        const user = document.getElementById("username").value;
        const pass = document.getElementById("password").value;
        if (user && pass) socket.emit("register_request", { username: user, password: pass });
    }

    socket.on("login_response", (data) => {
        document.getElementById("login-btn").innerHTML = 'LAUNCH <i class="fa-solid fa-rocket"></i>';
        document.getElementById("login-btn").style.opacity = "1";

        if (data.success) {
            document.getElementById("login-screen").style.display = "none";
            document.getElementById("chat-screen").style.display = "flex";
            if (data.role === 'admin') {
                document.getElementById("admin-panel").style.display = "flex";
            } else {
                document.getElementById("admin-panel").style.display = "none";
            }
        } else {
            alert(data.msg);
        }
    });

    socket.on("register_response", (data) => alert(data.msg));

    function sendMessage() {
        const msg = document.getElementById("message").value;
        if (msg) {
            socket.emit("send_message", { sender: username, msg });
            document.getElementById("message").value = "";
        }
    }

    document.getElementById("message").addEventListener("keypress", function(event) {
        if (event.key === "Enter") sendMessage();
    });

    socket.on("receive_message", (data) => {
        const chatBox = document.getElementById("chat-box");
        const msgDiv = document.createElement("div");
        msgDiv.classList.add("message");
        if (data.sender === username) msgDiv.classList.add("sent");
        else msgDiv.classList.add("received");

        let displayName = data.sender;
        if (data.isAdmin) {
            displayName = "👑 " + data.sender;
            msgDiv.classList.add("admin-msg");
        }
        
        msgDiv.innerHTML = `<strong style="font-size:12px; opacity:0.7; margin-bottom:4px; display:block;">${displayName}</strong>${data.msg}`;
        chatBox.appendChild(msgDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
    });

    socket.on("load_messages", (chats) => {
        document.getElementById("chat-box").innerHTML = "";
        chats.forEach(chat => {
            const msgDiv = document.createElement("div");
            msgDiv.classList.add("message");
            msgDiv.classList.add(chat.sender_name === username ? "sent" : "received");
            msgDiv.innerHTML = `<strong style="font-size:12px; opacity:0.7; margin-bottom:4px; display:block;">${chat.sender_name}</strong>${chat.message}`;
            document.getElementById("chat-box").appendChild(msgDiv);
        });
    });

    socket.on("update_user_list", (users) => document.getElementById("user-count").innerText = users.length);

    function createGroup() {
        const groupName = prompt("Enter Notice Board Name:");
        if (groupName) socket.emit("create_group_request", { name: groupName, desc: "Official" });
    }

    socket.on("group_creation_response", (data) => alert(data.msg));
</script>
</body>
</html>
