<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NovaChat</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #050505; color: white; margin: 0; overflow: hidden; display: flex; height: 100vh; }
        .sidebar { width: 300px; background: #0a0a0a; border-right: 1px solid #333; display: flex; flex-direction: column; }
        .sidebar-header { padding: 20px; border-bottom: 1px solid #222; }
        .chat-area { flex: 1; display: flex; flex-direction: column; }
        .chat-header { background: #0a0a0a; padding: 15px; border-bottom: 1px solid #ffd700; }
        #messages { flex: 1; overflow-y: auto; padding: 20px; list-style: none; display: flex; flex-direction: column; gap: 10px; }
        .msg-bubble { padding: 10px 15px; border-radius: 15px; max-width: 70%; }
        .msg-sent { align-self: flex-end; background: #ffd700; color: #000; }
        .msg-received { align-self: flex-start; background: #222; color: #fff; }
        .input-area { padding: 20px; background: #0a0a0a; display: flex; gap: 10px; }
        .input-area input { flex: 1; background: #1a1a1a; border: 1px solid #333; color: #fff; padding: 10px 20px; border-radius: 50px; outline: none; }
        .list-group-item { background: transparent; color: #aaa; border: none; cursor: pointer; padding: 15px; }
        .list-group-item:hover, .active-chat { background: #111; color: #ffd700; }
        #login-screen { position: fixed; inset: 0; background: #050505; z-index: 1000; display: flex; align-items: center; justify-content: center; }
        .login-card { background: #111; padding: 40px; border-radius: 20px; border: 1px solid #ffd700; text-align: center; width: 350px; }
    </style>
</head>
<body>

    <div id="login-screen">
        <div class="login-card">
            <h2 style="color:#ffd700;"><i class="fas fa-meteor"></i> NovaChat</h2>
            <input type="text" id="username" class="form-control bg-dark text-white mb-3" placeholder="Username">
            <input type="password" id="password" class="form-control bg-dark text-white mb-3" placeholder="Password">
            <button onclick="login()" class="btn btn-warning w-100 fw-bold">Login</button>
        </div>
    </div>

    <div class="sidebar">
        <div class="sidebar-header">
            <h4 style="color:#ffd700;">NovaChat</h4>
        </div>
        <ul id="user-list" class="list-group"></ul>
    </div>

    <div class="chat-area">
        <div class="chat-header">
            <h5 id="chat-title" class="m-0">Nebula Network</h5>
        </div>
        <ul id="messages"></ul>
        <div class="input-area">
            <input type="text" id="message-input" placeholder="Type a message..." onkeypress="if(event.key==='Enter') sendMessage()">
            <button class="btn btn-warning" onclick="sendMessage()"><i class="fas fa-paper-plane"></i></button>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let myName = "";
        let currentChat = "Everyone";

        function login() {
            const user = document.getElementById("username").value;
            const pass = document.getElementById("password").value;
            if(user && pass) {
                myName = user;
                socket.emit("login_request", { username: user, password: pass });
            }
        }

        socket.on("login_response", (data) => {
            if(data.success) {
                document.getElementById("login-screen").style.display = "none";
            } else { alert(data.msg); }
        });

        function switchChat(user) {
            currentChat = user;
            document.getElementById("chat-title").innerText = user === "Everyone" ? "Nebula Network" : user;
            document.getElementById("messages").innerHTML = "";
            document.querySelectorAll(".list-group-item").forEach(el => el.classList.remove("active-chat"));
            document.getElementById("user-" + user).classList.add("active-chat");
        }

        function sendMessage() {
            const input = document.getElementById("message-input");
            if(input.value.trim()) {
                socket.emit("send_message", { sender: myName, msg: input.value, toUser: currentChat, type: currentChat === "Everyone" ? 'public' : 'private' });
                input.value = "";
            }
        }

        socket.on("receive_message", (data) => {
            const list = document.getElementById("messages");
            const li = document.createElement("li");
            li.className = `msg-bubble ${data.sender === myName ? 'msg-sent' : 'msg-received'}`;
            li.innerHTML = `<strong>${data.sender}:</strong> ${data.msg}`;
            list.appendChild(li);
            list.scrollTop = list.scrollHeight;
        });

        socket.on("update_user_list", (users) => {
            const list = document.getElementById("user-list");
            list.innerHTML = `<li class="list-group-item active-chat" id="user-Everyone" onclick="switchChat('Everyone')"><i class="fas fa-globe"></i> Everyone</li>`;
            users.forEach(u => {
                if(u !== myName) {
                    list.innerHTML += `<li class="list-group-item" id="user-${u}" onclick="switchChat('${u}')"><i class="fas fa-user"></i> ${u}</li>`;
                }
            });
        });
    </script>
</body>
</html>
