<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NovaChat Gold</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #050505; color: white; margin: 0; overflow: hidden; display: flex; height: 100vh; }
        .sidebar { width: 300px; background: #0a0a0a; border-right: 1px solid rgba(255,215,0,0.2); display: flex; flex-direction: column; }
        .sidebar-header { padding: 20px; border-bottom: 1px solid rgba(255,215,0,0.1); }
        .chat-area { flex: 1; display: flex; flex-direction: column; background: #000; }
        .chat-header { background: #0a0a0a; padding: 15px; border-bottom: 1px solid #ffd700; display: flex; justify-content: space-between; align-items: center; }
        #messages { flex: 1; overflow-y: auto; padding: 25px; list-style: none; display: flex; flex-direction: column; gap: 12px; }
        .msg-bubble { padding: 12px 18px; border-radius: 20px; max-width: 70%; position: relative; }
        .msg-sent { align-self: flex-end; background: linear-gradient(135deg, #ffd700, #ffaa00); color: #000; font-weight: 500; }
        .msg-received { align-self: flex-start; background: #1a1a1a; color: #fff; border: 1px solid #333; }
        .notif-badge { background: red; color: white; font-size: 10px; border-radius: 50%; padding: 2px 6px; float: right; margin-top: 5px; font-weight: bold; }
        .input-area { padding: 20px; background: #0a0a0a; display: flex; gap: 15px; border-top: 1px solid #222; }
        .input-area input { flex: 1; background: #111; border: 1px solid #333; color: #fff; padding: 12px 25px; border-radius: 50px; outline: none; }
        .list-group-item { background: transparent; color: #888; border: none; cursor: pointer; padding: 15px; transition: 0.3s; position: relative; }
        .list-group-item:hover, .active-chat { background: rgba(255,215,0,0.1); color: #ffd700; }
        #login-screen { position: fixed; inset: 0; background: #050505; z-index: 1000; display: flex; align-items: center; justify-content: center; }
        .login-card { background: #0c0c0c; padding: 40px; border-radius: 25px; border: 1px solid #ffd700; text-align: center; width: 380px; }
        .role-sel { display: flex; justify-content: center; gap: 20px; margin-bottom: 20px; color: #ccc; }
        .modal-box { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 2000; align-items: center; justify-content: center; }
        .modal-content { background: #111; border: 1px solid #ffd700; padding: 30px; border-radius: 20px; width: 320px; }
    </style>
</head>
<body>

    <div id="login-screen">
        <div class="login-card">
            <h2 style="color:#ffd700;"><i class="fas fa-meteor"></i> NovaChat</h2>
            <div class="role-sel">
                <label><input type="radio" name="role" value="student" checked> Student</label>
                <label><input type="radio" name="role" value="admin"> Admin</label>
            </div>
            <input type="text" id="username" class="form-control bg-dark text-white mb-3 rounded-pill" placeholder="Username">
            <input type="password" id="password" class="form-control bg-dark text-white mb-4 rounded-pill" placeholder="Password">
            <button onclick="login()" class="btn btn-warning w-100 rounded-pill fw-bold mb-3">LAUNCH 🚀</button>
            <button onclick="register()" class="btn btn-outline-light w-100 rounded-pill">Create Account</button>
        </div>
    </div>

    <div class="sidebar">
        <div class="sidebar-header">
            <h4 style="color:#ffd700;"><i class="fas fa-meteor"></i> NovaChat</h4>
            <small id="connected-as" style="color:#666;">Connected as ...</small>
            <button id="admin-add-btn" class="btn btn-sm btn-warning mt-2 d-none" onclick="openModal()">+ Create Group</button>
        </div>
        <ul id="user-list" class="list-group"></ul>
    </div>

    <div class="chat-area">
        <div class="chat-header">
            <h5 id="chat-title" class="m-0">Bvrc</h5>
            <button class="btn btn-sm btn-outline-danger rounded-pill" onclick="clearChat()">Clear History</button>
        </div>
        <ul id="messages"></ul>
        <div class="input-area">
            <input type="text" id="message-input" placeholder="Message..." onkeypress="if(event.key==='Enter') sendMessage()">
            <button class="btn btn-warning rounded-circle" onclick="sendMessage()"><i class="fas fa-paper-plane"></i></button>
        </div>
    </div>

    <div id="group-modal" class="modal-box">
        <div class="modal-content">
            <h5 style="color:#ffd700;">Create Notice Board</h5>
            <input type="text" id="g-name" class="form-control mb-2" placeholder="Group Name">
            <input type="number" id="g-limit" class="form-control mb-2" placeholder="Member Limit">
            <input type="password" id="g-pass" class="form-control mb-3" placeholder="Set Password">
            <button class="btn btn-warning w-100" onclick="submitGroup()">Create</button>
            <button class="btn btn-dark w-100 mt-2" onclick="closeModal()">Cancel</button>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let myName = "", myRole = "student", currentChat = "Bvrc", chatType = "public";
        let unread = {};

        function login() {
            const user = document.getElementById("username").value;
            const pass = document.getElementById("password").value;
            if(user && pass) socket.emit("login_request", { username: user, password: pass });
        }

        function register() {
            const user = document.getElementById("username").value;
            const pass = document.getElementById("password").value;
            const role = document.querySelector('input[name="role"]:checked').value;
            if(user && pass) socket.emit("register_request", { username: user, password: pass, role: role });
        }

        socket.on("login_response", (data) => {
            if(data.success) {
                myName = data.username; myRole = data.role;
                document.getElementById("login-screen").style.display = "none";
                document.getElementById("connected-as").innerText = "Connected as " + myName;
                if(myRole === 'admin') document.getElementById("admin-add-btn").classList.remove("d-none");
            } else alert(data.msg);
        });

        socket.on("register_response", (data) => alert(data.msg));

        function switchChat(target, type) {
            currentChat = target; chatType = type;
            unread[target] = 0;
            document.getElementById("chat-title").innerText = target;
            document.getElementById("messages").innerHTML = "";
            const input = document.getElementById("message-input");
            if(type === 'group' && myRole !== 'admin') {
                input.disabled = true; input.placeholder = "Read Only (Admin Only)";
            } else { input.disabled = false; input.placeholder = "Message..."; }
            updateUI();
        }

        function sendMessage() {
            const input = document.getElementById("message-input");
            if(input.value.trim()) {
                socket.emit("send_message", { sender: myName, msg: input.value, toUser: currentChat, type: chatType });
                input.value = "";
            }
        }

        socket.on("receive_message", (data) => {
            if((data.type === 'public' && currentChat === 'Bvrc') || 
               (data.type === 'private' && (data.sender === currentChat || data.sender === myName)) || 
               (data.type === 'group' && data.toUser === currentChat)) {
                addMsg(data);
            } else {
                // RED NOTIFICATION BUBBLE
                unread[data.sender] = (unread[data.sender] || 0) + 1;
                updateUI();
            }
        });

        function addMsg(data) {
            const list = document.getElementById("messages");
            const li = document.createElement("li");
            li.className = `msg-bubble ${data.sender === myName ? 'msg-sent' : 'msg-received'}`;
            li.innerHTML = `<strong>${data.sender}:</strong> ${data.msg}`;
            list.appendChild(li);
            list.scrollTop = list.scrollHeight;
        }

        // --- GROUP LOGIC ---
        function openModal() { document.getElementById("group-modal").style.display = "flex"; }
        function closeModal() { document.getElementById("group-modal").style.display = "none"; }
        function submitGroup() {
            const name = document.getElementById("g-name").value;
            const limit = document.getElementById("g-limit").value;
            const pass = document.getElementById("g-pass").value;
            socket.emit("create_group", { name, limit, password: pass });
            closeModal();
        }

        socket.on("update_lists", (data) => {
            const list = document.getElementById("user-list");
            list.innerHTML = `<li class="list-group-item active-chat" onclick="switchChat('Bvrc', 'public')"><i class="fas fa-globe me-2"></i> Bvrc Group</li>`;
            data.groups.forEach(g => {
                list.innerHTML += `<li class="list-group-item" onclick="joinGroupPrompt('${g}')"><i class="fas fa-bullhorn me-2"></i> ${g}</li>`;
            });
            data.users.forEach(u => {
                if(u !== myName) {
                    let badge = unread[u] > 0 ? `<span class="notif-badge">${unread[u]}</span>` : "";
                    list.innerHTML += `<li class="list-group-item" onclick="switchChat('${u}', 'private')"><i class="fas fa-user-shield me-2"></i> ${u} ${badge}</li>`;
                }
            });
        });

        function joinGroupPrompt(name) {
            const pass = prompt(`Enter Password for ${name}:`);
            if(pass) socket.emit("join_group", { name, password: pass });
        }
        socket.on("group_join_success", (data) => switchChat(data.name, 'group'));
        socket.on("group_response", (data) => alert(data.msg));
        function updateUI() { /* Logic for list refreshes if needed */ }
    </script>
</body>
</html>
