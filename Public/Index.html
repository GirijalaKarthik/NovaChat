<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NovaChat</title>
    <style>
        /* --- 1. THE PITCH BLACK THEME --- */
        body { 
            font-family: 'Segoe UI', sans-serif; 
            background-color: #050505; /* Pitch Black */
            color: white; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
        }

        #app { 
            width: 360px; 
            background: #0f0f0f; /* Dark Grey Card */
            padding: 40px; 
            border-radius: 20px; 
            border: 1px solid #222;
            box-shadow: 0 0 20px rgba(0,0,0,0.5); 
            text-align: center;
        }

        /* --- 2. LOGO (GOLD & BOLD) --- */
        h2 { 
            color: #ffd700; /* Pure Gold */
            margin-bottom: 30px; 
            font-size: 32px; 
            font-weight: 800; /* Extra Bold */
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            letter-spacing: 1px;
        }
        
        /* No filters, just big size */
        .logo-icon { font-size: 36px; }

        /* --- 3. TOGGLES (Your Requirement) --- */
        .role-selector {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 25px;
            color: #eee;
            font-weight: 500;
        }
        .role-selector label { 
            cursor: pointer; 
            display: flex; 
            align-items: center; 
            gap: 8px;
        }
        input[type="radio"] { 
            accent-color: #ffd700; 
            transform: scale(1.3); 
            cursor: pointer; 
        }

        /* --- 4. INPUTS (Dark & Rounded) --- */
        input[type="text"], input[type="password"] { 
            width: 100%; 
            padding: 15px 20px; 
            margin: 10px 0; 
            border-radius: 30px; 
            border: none; 
            background: #1a1a1a; 
            color: white; 
            font-size: 16px;
            box-sizing: border-box; 
            outline: none;
        }
        input:focus { background: #222; box-shadow: 0 0 0 1px #ffd700; }

        /* --- 5. THE BUTTON (CRITICAL FIX) --- */
        .btn-primary { 
            width: 100%; 
            padding: 16px; 
            margin-top: 25px; 
            border-radius: 30px; 
            border: none; 
            font-size: 18px; 
            font-weight: 900; /* ULTRA BOLD */
            cursor: pointer; 
            
            /* THIS IS THE KEY: BLACK TEXT ON GOLD */
            background: #ffd700; 
            color: black; 
            
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.3); /* The Glow */
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .btn-primary:hover { 
            transform: scale(1.02); 
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.5); 
        }

        .btn-secondary {
            width: 100%;
            padding: 15px;
            margin-top: 15px;
            border-radius: 30px;
            background: transparent;
            border: 1px solid #444;
            color: #bbb;
            font-size: 14px;
            cursor: pointer;
        }
        .btn-secondary:hover { border-color: white; color: white; }

        /* --- CHAT AREA --- */
        #chat-screen { display: none; flex-direction: column; height: 600px; }
        #chat-box { flex: 1; overflow-y: auto; padding: 20px; background: #111; border-radius: 15px; margin-bottom: 20px; border: 1px solid #222; }
        
        .message { padding: 10px 15px; margin: 8px 0; border-radius: 20px; max-width: 80%; font-size: 15px; }
        .sent { background: #ffd700; color: black; align-self: flex-end; font-weight: 500;}
        .received { background: #222; color: white; align-self: flex-start; }
        
        #admin-panel { display: none; background: #1a1a1a; padding: 15px; margin-bottom: 20px; border-left: 5px solid #ffd700; text-align: left; border-radius: 8px;}
        
        .chat-input-area { display: flex; gap: 10px; }
        .send-btn { width: 55px; height: 55px; border-radius: 50%; border: none; background: #ffd700; font-size: 24px; cursor: pointer; display: flex; justify-content: center; align-items: center; color: black;}

    </style>
</head>
<body>

<div id="app">
    <div id="login-screen">
        <h2><span class="logo-icon">☄️</span> NovaChat</h2>
        
        <div class="role-selector">
            <label><input type="radio" name="role" value="student" checked onchange="togglePlaceholder()"> Student</label>
            <label><input type="radio" name="role" value="admin" onchange="togglePlaceholder()"> Admin</label>
        </div>

        <input type="text" id="username" placeholder="Username">
        <input type="password" id="password" placeholder="Password">
        
        <button id="login-btn" class="btn-primary" onclick="login()">LAUNCH 🚀</button>
        <button class="btn-secondary" onclick="register()">Create Account</button>
    </div>

    <div id="chat-screen">
        <div id="admin-panel">
            <h3 style="color: #ffd700; margin: 0; font-size: 18px;">👑 Admin Controls</h3>
            <button onclick="createGroup()" style="background:#ffd700; color:black; border:none; padding:8px 15px; border-radius:30px; margin-top:10px; font-weight:bold; cursor:pointer;">+ New Notice Board</button>
        </div>

        <div id="chat-box"></div>
        
        <div class="chat-input-area">
            <input type="text" id="message" placeholder="Type a message..." style="margin:0;">
            <button class="send-btn" onclick="sendMessage()">➤</button>
        </div>
        <p style="font-size: 12px; color: #555; margin-top: 15px;">Secure Connection • <span id="user-count">0</span> Online</p>
    </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
    const socket = io();
    let username = "";

    function togglePlaceholder() {
        const role = document.querySelector('input[name="role"]:checked').value;
        const input = document.getElementById("username");
        if(role === 'admin') input.placeholder = "Admin ID (e.g. Hod@mca)";
        else input.placeholder = "Student Name";
    }

    function login() {
        username = document.getElementById("username").value;
        const pass = document.getElementById("password").value;
        const btn = document.getElementById("login-btn");

        if (username && pass) {
            btn.innerHTML = "CONNECTING..."; 
            btn.style.opacity = "0.7";
            socket.emit("login_request", { username, password: pass });
        } else {
            alert("Please enter both Username and Password!");
        }
    }

    function register() {
        const user = document.getElementById("username").value;
        const pass = document.getElementById("password").value;
        if (user && pass) socket.emit("register_request", { username: user, password: pass });
    }

    socket.on("login_response", (data) => {
        document.getElementById("login-btn").innerHTML = "LAUNCH 🚀";
        document.getElementById("login-btn").style.opacity = "1";

        if (data.success) {
            document.getElementById("login-screen").style.display = "none";
            document.getElementById("chat-screen").style.display = "flex";
            if (data.role === 'admin') document.getElementById("admin-panel").style.display = "block";
        } else {
            alert(data.msg);
        }
    });

    socket.on("register_response", (data) => alert(data.msg));

    function sendMessage() {
        const msg = document.getElementById("message").value;
        if (msg) {
            socket.emit("send_message", { sender: username, msg });
            document.getElementById("message").value = "";
        }
    }

    socket.on("receive_message", (data) => {
        const chatBox = document.getElementById("chat-box");
        const msgDiv = document.createElement("div");
        msgDiv.classList.add("message");
        if (data.sender === username) msgDiv.classList.add("sent");
        else msgDiv.classList.add("received");

        let displayName = data.sender;
        if (data.isAdmin) {
            displayName = "👑 " + data.sender;
            if(data.sender !== username) {
                 msgDiv.style.border = "1px solid #ffd700";
            }
        }
        msgDiv.innerHTML = `<strong>${displayName}:</strong><br>${data.msg}`;
        chatBox.appendChild(msgDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
    });

    socket.on("load_messages", (chats) => {
        document.getElementById("chat-box").innerHTML = "";
        chats.forEach(chat => {
            const msgDiv = document.createElement("div");
            msgDiv.classList.add("message");
            msgDiv.classList.add(chat.sender_name === username ? "sent" : "received");
            msgDiv.innerHTML = `<strong>${chat.sender_name}:</strong><br>${chat.message}`;
            document.getElementById("chat-box").appendChild(msgDiv);
        });
    });

    socket.on("update_user_list", (users) => document.getElementById("user-count").innerText = users.length);

    function createGroup() {
        const groupName = prompt("Enter Notice Board Name:");
        if (groupName) socket.emit("create_group_request", { name: groupName, desc: "Official" });
    }

    socket.on("group_creation_response", (data) => alert(data.msg));
</script>
</body>
</html>
