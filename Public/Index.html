    <style>
        body { background-color: #121212; color: #FFD700; font-family: Arial, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        #chat-screen { display: none; width: 100%; max-width: 600px; height: 80vh; flex-direction: column; }
        #chat-container { flex-grow: 1; overflow-y: auto; border: 1px solid #FFD700; padding: 10px; margin-bottom: 10px; }
        #user-list { border: 1px solid #FFD700; padding: 10px; margin-bottom: 10px; height: 100px; overflow-y: auto; }
        input, button { padding: 10px; margin: 5px; background: #222; color: #FFD700; border: 1px solid #FFD700; }
        .msg { margin-bottom: 5px; }
        .action-btn { cursor: pointer; font-size: 0.8em; margin-left: 5px; }
    </style>
</head>
<body>

    <div id="landing-screen">
        <h1>NovaChat Spaces</h1>
        <input type="text" id="username" placeholder="Enter Nickname">
        <button onclick="createSpace()">Create Space</button>
        <br><br>
        <input type="text" id="space-code-input" placeholder="Enter Space Code">
        <button onclick="joinSpace()">Join Space</button>
    </div>

    <div id="chat-screen">
        <h2>Space: <span id="display-code"></span></h2>
        <div id="user-list"></div>
        <div id="chat-container"></div>
        <div style="display: flex;">
            <input type="text" id="message-input" placeholder="Type a message..." style="flex-grow: 1;">
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let isHost = false;
        let currentSpaceCode = '';
        let myUsername = '';

        function showChat() {
            document.getElementById('landing-screen').style.display = 'none';
            document.getElementById('chat-screen').style.display = 'flex';
            document.getElementById('display-code').innerText = currentSpaceCode;
        }

        function createSpace() {
            myUsername = document.getElementById('username').value || 'Anonymous';
            socket.emit('create_space', myUsername);
        }

        function joinSpace() {
            myUsername = document.getElementById('username').value || 'Anonymous';
            currentSpaceCode = document.getElementById('space-code-input').value;
            socket.emit('join_space', { spaceCode: currentSpaceCode, username: myUsername });
        }

        function sendMessage() {
            const text = document.getElementById('message-input').value;
            if (text.trim() !== '') {
                socket.emit('send_message', { spaceCode: currentSpaceCode, username: myUsername, text });
                document.getElementById('message-input').value = '';
            }
        }

        socket.on('space_created', (data) => {
            isHost = data.isHost;
            currentSpaceCode = data.spaceCode;
            showChat();
        });

        socket.on('space_joined', (data) => {
            isHost = data.isHost;
            currentSpaceCode = data.spaceCode;
            showChat();
        });

        socket.on('receive_message', ({ messageId, username, text }) => {
            const chatContainer = document.getElementById('chat-container');
            const messageDiv = document.createElement('div');
            messageDiv.className = 'msg';
            messageDiv.id = messageId;
            messageDiv.innerText = `${username}: ${text}`;

            if (isHost) {
                const delBtn = document.createElement('span');
                delBtn.innerHTML = '🗑️';
                delBtn.className = 'action-btn';
                delBtn.onclick = () => socket.emit('delete_message', { spaceCode: currentSpaceCode, messageId });
                messageDiv.appendChild(delBtn);
            }
            
            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        });

        socket.on('update_users', (users) => {
            const userListContainer = document.getElementById('user-list');
            userListContainer.innerHTML = '<strong>Users:</strong><br>';
            users.forEach(user => {
                const userElement = document.createElement('div');
                userElement.innerText = user.name;

                if (isHost && user.id !== socket.id) {
                    const kickBtn = document.createElement('span');
                    kickBtn.innerHTML = '❌';
                    kickBtn.className = 'action-btn';
                    kickBtn.onclick = () => socket.emit('kick_user', { spaceCode: currentSpaceCode, targetId: user.id });
                    userElement.appendChild(kickBtn);
                }
                userListContainer.appendChild(userElement);
            });
        });

        socket.on('kicked', () => {
            alert("You have been kicked by the host.");
            window.location.reload();
        });

        socket.on('message_removed', (messageId) => {
            const msgElement = document.getElementById(messageId);
            if (msgElement) {
                msgElement.innerHTML = '<i>Message deleted by host</i>';
                msgElement.style.color = 'gray';
            }
        });

        socket.on('space_ended', () => {
            alert("The host has ended the space.");
            window.location.reload();
        });

        socket.on('error', (msg) => {
            alert(msg);
        });
    </script>
</body>
</html>
